# proton-mail-mcp: Proton Mail access for an AI agent, reachable only over a Tailscale tailnet.
# See README.md.
#
#   agent ──tailnet──> ts-mail (tailscale serve, HTTPS 443) ──ts-link──> pmm-server:8080
#   mail-mcp ──mail-internal──> bridge:11143 (IMAP STARTTLS, pinned cert) ──egress──> Proton
#
# mail-mcp has no route to the internet: both of its networks are internal.

services:
  bridge:
    build: ./bridge
    image: proton-mail-mcp/bridge:3.27.2
    container_name: pmm-bridge
    restart: unless-stopped
    volumes:
      - ./data/bridge:/home/bridge          # Bridge vault + gpg/pass store: treat as a secret
    networks: [mail-internal, bridge-egress]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    pids_limit: 200

  mail-mcp:
    build: ./server
    image: proton-mail-mcp/server:0.2.0
    container_name: pmm-server
    restart: unless-stopped
    env_file: ./mail-mcp.env                 # IMAP_USER, IMAP_CERT_SHA256 (not secret)
    environment:
      IMAP_HOST: bridge
      IMAP_PORT: "11143"
      LISTEN_ADDR: 0.0.0.0:8080
      # Secrets are files, not env vars, so `docker inspect` doesn't show them.
      MCP_TOKEN_FILE: /run/secrets/mcp_token
      IMAP_PASSWORD_FILE: /run/secrets/imap_password
    volumes:
      - ./secrets:/run/secrets:ro            # mcp_token, imap_password: owner 65534, mode 0400
      - ./data/audit:/audit                  # audit.log of every change: owner 65534, mode 0700
    networks: [mail-internal, ts-link]
    depends_on: [bridge]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    pids_limit: 64

  ts-mail:
    image: tailscale/tailscale:v1.104.7@sha256:72c1e19e0aedca96b8533bbb0b4368564410ff20b17e53b804eb6c1f04a31be4
    container_name: pmm-tailscale
    restart: unless-stopped
    env_file: ./ts.env                       # TS_AUTHKEY (tagged tag:mail-mcp, single use) (chmod 600)
    environment:
      TS_HOSTNAME: mail-mcp
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
      TS_ACCEPT_DNS: "false"
      TS_SERVE_CONFIG: /config/serve.json
      TS_EXTRA_ARGS: --advertise-tags=tag:mail-mcp
    volumes:
      - ./data/tailscale:/var/lib/tailscale
      - ./ts:/config:ro
    networks: [ts-link, ts-egress]
    depends_on: [mail-mcp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    pids_limit: 100

networks:
  mail-internal: { internal: true }
  ts-link: { internal: true }
  bridge-egress: {}
  ts-egress: {}
