[package]
name = "proton-mail-mcp"
version = "0.2.0"
edition = "2024"
rust-version = "1.96"
description = "Read-only MCP server for a Proton Mail Bridge mailbox"
license = "MIT"
publish = false

# Only TLS and crypto come from outside: IMAP, HTTP, JSON and MIME are written here.
[dependencies]
ring = "=0.17.14"
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = { version = "=1.16.0", features = ["std"] }

[profile.release]
codegen-units = 1
lto = true
strip = true
